server:
  port: 8090
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    allow-circular-references: true
    banner-mode: off
  web:
    resources:
      add-mappings: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  jmx:
    enabled: false
  application:
    name: spring-cloud-gateway-sentinel-demo
  cloud:
    sentinel:
      enabled: true
      # 启动时注册到 Dashboard，不必等待第一条业务请求。
      eager: true
      # 网关只统计 route 和 API 分组，关闭普通 Web URL 资源过滤器。
      filter:
        enabled: false
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8678}
        # 与普通 Spring Cloud Demo 的 8720 分开；这是管理端口，不是业务端口。
        port: ${SENTINEL_PORT:8721}
#        client-ip: ${SENTINEL_CLIENT_IP:}
    gateway:
      server:
        webflux:
          enabled: true
          discovery:
            locator:
              lower-case-service-id: true
          routes:
            # Add your routes here.
            - id: aliyun_route
              uri: https://www.aliyun.com/
              predicates:
                - Path=/product/**
              filters:
                - name: CircuitBreaker
                  args:
                    # 熔断资源与网关限流的 routeId 分开，避免重复统计。
                    name: aliyun_route_cb
                    # 不配置 fallbackUri 时，将 /product/123 转给原下游的 /product/123/fallback。
                    statusCodes: [500, 502, 503, 504]
            - id: httpbin_route
              uri: https://httpbin.org
              predicates:
                - Path=/httpbin/{*segments}
              filters:
                # CircuitBreaker 包装 RewritePath，降级时使用原路由捕获的路径变量。
                - name: CircuitBreaker
                  args:
                    name: httpbin_route_cb
                    # 此路由单独配置；segments 已包含开头的 /。
                    fallbackUri: forward:/httpbin/fallback{segments}
                    statusCodes: [500, 502, 503, 504]
                - RewritePath=/httpbin/(?<segment>.*), /$\{segment}

demo:
  gateway:
    # 未单独配置时在原请求路径后追加 /fallback；下游需提供对应接口，此项省略时默认值相同。
    default-fallback-uri: forward:/{sentinelOriginalPath}/fallback
