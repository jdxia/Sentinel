server.port=10001

server.address=0.0.0.0
server.shutdown=graceful

spring.web.resources.add-mappings=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
spring.application.name=sentinel-demo-spring-webmvc
spring.mvc.servlet.load-on-startup=1
spring.main.banner-mode=off

# Sentinel 流控规则在 Nacos 中的唯一来源；生产环境通过环境变量覆盖服务地址。
sentinel.datasource.nacos.server-addr=${NACOS_SERVER_ADDR:192.168.33.20:8848}
sentinel.datasource.nacos.namespace=${NACOS_NAMESPACE:sentinel}
sentinel.datasource.nacos.group-id=${NACOS_GROUP_ID:SENTINEL_GROUP}
sentinel.datasource.nacos.data-id=${spring.application.name}-flow-rules
