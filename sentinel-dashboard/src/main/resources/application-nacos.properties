# 两端必须连接同一 Nacos 地址、namespace ID、group；凭据从环境变量注入。
sentinel.nacos.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
sentinel.nacos.namespace=${NACOS_NAMESPACE:}
sentinel.nacos.group-id=${NACOS_GROUP:SENTINEL_GROUP}
sentinel.nacos.username=${NACOS_USERNAME:}
sentinel.nacos.password=${NACOS_PASSWORD:}
sentinel.nacos.timeout-ms=3000
# Data ID 使用 应用名-profile-规则后缀；这里必须与客户端用于拼接 Data ID 的 profile 一致。
sentinel.nacos.rule-profile=${spring.profiles.active}
