# 两端必须连接同一 Nacos 地址、namespace ID、group；凭据从环境变量注入。
sentinel.nacos.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
sentinel.nacos.namespace=${NACOS_NAMESPACE:}
sentinel.nacos.group-id=${NACOS_GROUP:SENTINEL_GROUP}
sentinel.nacos.username=${NACOS_USERNAME:}
sentinel.nacos.password=${NACOS_PASSWORD:}
sentinel.nacos.timeout-ms=3000
# Data ID 使用 应用名-spring.profiles.active-规则后缀；两端的 profile 值必须一致。
# 启动后异步扫描当前 namespace/group/profile 的七类配置；失败不阻塞启动，操作前仍重新读取。
sentinel.nacos.preload-enabled=${NACOS_PRELOAD_ENABLED:true}

# 按应用发布普通五类规则及 gw-flow/gw-api-group；同名实例共同监听。
# 必须预先创建对应 Data ID（空规则为 []）；读失败、缺失或 CAS 失败均不会回退到 HTTP 推送。
# INFO 记录读写阶段、规则数量、MD5、锁等待和总耗时；不输出密码或完整规则正文。
logging.level.com.alibaba.csp.sentinel.dashboard.rule.nacos=INFO
